<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#04050c" />
    <meta name="description" content="Pansuan (ปันส่วน) — จัดพอร์ตการลงทุนด้วย Sankey Diagram" />
    <meta name="author" content="ICEPAJINGKO" />
    <meta name="copyright" content="© 2026 ICEPAJINGKO. All rights reserved." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400..700&family=IBM+Plex+Sans+Thai:wght@400;600&family=JetBrains+Mono:wght@400..500&display=swap"
      rel="stylesheet"
    />
    <title>Pansuan · ปันส่วน</title>

    <!--
      Link previews. %SITE_URL% is filled in at build time from the deployment's
      own hostname (see vite.config.ts), because og:image has to be absolute and
      the domain is not something the source should have to hard-code.
    -->
    <link rel="canonical" href="%SITE_URL%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pansuan" />
    <meta property="og:title" content="Pansuan · ปันส่วน" />
    <meta
      property="og:description"
      content="จัดพอร์ตการลงทุนด้วย Sankey Diagram — กรอกได้ทั้งเปอร์เซ็นต์และจำนวนเงิน แผนภาพไหลตามทันที"
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:width" content="1600" />
    <meta property="og:image:height" content="950" />
    <meta property="og:image:alt" content="แผนภาพ Sankey แสดงการจัดสรรพอร์ตการลงทุน" />
    <meta property="og:locale" content="th_TH" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pansuan · ปันส่วน" />
    <meta
      name="twitter:description"
      content="จัดพอร์ตการลงทุนด้วย Sankey Diagram — กรอกได้ทั้งเปอร์เซ็นต์และจำนวนเงิน แผนภาพไหลตามทันที"
    />
    <meta name="twitter:image" content="%SITE_URL%/og.png" />
    <script>
      (function () {
        var root = document.documentElement

        // Theme before first paint, so there is no flash of the wrong tone.
        var saved = null
        try {
          saved = localStorage.getItem('pansuan:theme')
        } catch (e) {}
        if (saved !== 'light' && saved !== 'dusk' && saved !== 'night') {
          saved = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dusk'
        }
        root.dataset.theme = saved

        // On modest hardware we drop the backdrop blur rather than making a
        // low-end phone pay for it every frame.
        var mem = navigator.deviceMemory || 8
        var cores = navigator.hardwareConcurrency || 8
        if (mem <= 4 || cores <= 4) root.classList.add('lite')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
